<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobox Instructions - The Unknown Beast</title>

  <style>
    /* Reset */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --red: #ff003c;
      --black: #1d1d1d;
      --paper: #f2f4f7;
      --white: #ffffff;
      --line: #1d1d1d;
      --muted: #767676;
    }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--black);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
    }

    .site-header {
      background: var(--red);
      color: var(--white);
      padding: 28px 32px 34px;
    }

    .header-inner,
    main,
    .site-footer {
      width: min(1180px, calc(100% - 64px));
      margin: 0 auto;
    }

    .header-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 70px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.13em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .header-meta a {
      text-decoration: none;
    }

    .header-meta a:hover,
    .header-meta a:focus-visible {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    h1 {
      max-width: 980px;
      font-size: clamp(56px, 12vw, 154px);
      font-weight: 900;
      letter-spacing: -0.085em;
      line-height: 0.83;
      text-transform: uppercase;
    }

    .hero-note {
      max-width: 420px;
      margin-top: 32px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
    }

    main {
      padding: 64px 0 88px;
    }

    .section-intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 32px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--line);
      margin-bottom: 24px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .section-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 48px 24px;
    }

    .gallery-item {
      min-width: 0;
    }

    .image-wrap {
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--line);
      aspect-ratio: 4 / 3;
    }

    .image-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 220ms ease;
    }

    .gallery-item:hover .image-wrap img,
    .gallery-item:focus-within .image-wrap img {
      transform: scale(1.025);
    }

    .image-caption {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      margin-top: 10px;
    }

    .image-number {
      color: var(--red);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .image-copy {
      font-size: 14px;
      line-height: 1.4;
    }

    .image-copy strong {
      display: block;
      margin-bottom: 3px;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .site-footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 0 28px;
      border-top: 2px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    :focus-visible {
      outline: 3px solid var(--red);
      outline-offset: 4px;
    }

    @media (max-width: 700px) {
      .site-header {
        padding: 22px 20px 28px;
      }

      .header-inner,
      main,
      .site-footer {
        width: min(100% - 40px, 1180px);
      }

      .header-meta {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 56px;
      }

      main {
        padding: 42px 0 64px;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 36px;
      }

      .site-footer {
        flex-direction: column;
        gap: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .image-wrap img {
        transition: none;
      }
    }
  </style>
</head>
