<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobox Instructions - The Unknown Beast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --paper: #f4f4ef;
      --ink: #0b0b0b;
      --muted: #777771;
      --soft: #e5e5df;
      --font: "Barlow Condensed", "Arial Narrow", sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font);
      font-weight: 600;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
    }

    .site-header,
    main,
    .site-footer {
      width: min(1180px, calc(100% - 64px));
      margin: 0 auto;
    }

    .site-header {
      padding: 28px 0 106px;
    }

    .header-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 104px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .header-meta a {
      color: var(--ink);
      text-decoration: none;
    }

    .header-meta a:hover,
    .header-meta a:focus-visible {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(240px, 0.7fr);
      align-items: end;
      gap: 72px;
    }

    .hero-kicker,
    .hero-side-label,
    .archive-label,
    .archive-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .hero-kicker {
      margin-bottom: 22px;
    }

    h1 {
      max-width: 850px;
      font-size: clamp(58px, 10vw, 134px);
      font-weight: 600;
      letter-spacing: -0.09em;
      line-height: 0.82;
      text-transform: uppercase;
    }

    .hero-side {
      max-width: 350px;
      padding-bottom: 4px;
    }

    .hero-side-label {
      margin-bottom: 15px;
    }

    .hero-side-copy {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.35;
    }

    main {
      padding: 0 0 96px;
    }

    .archive-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 32px;
      margin-bottom: 34px;
    }

    .archive-count {
      color: var(--muted);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 28px;
      row-gap: 62px;
    }

    .print-page,
    .print-grid {
      display: contents;
    }

    .print-intro {
      display: none;
    }

    .gallery-item {
      min-width: 0;
    }

    .image-wrap {
      background: var(--soft);
    }

    .image-wrap img {
      display: block;
      width: 100%;
      height: auto;
      transition: opacity 180ms ease;
    }

    .gallery-item:hover .image-wrap img,
    .gallery-item:focus-within .image-wrap img {
      opacity: 0.78;
    }

    .image-caption {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 14px;
      padding-top: 12px;
    }

    .image-number {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .image-copy {
      color: var(--muted);
      font-size: 17px;
      font-weight: 600;
      line-height: 1.25;
    }

    .image-copy strong {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
      font-size: 19px;
      font-weight: 600;
      line-height: 1.05;
      text-transform: uppercase;
    }

    .site-footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding: 22px 0 30px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    :focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 4px;
    }

    @media (max-width: 760px) {
      .site-header,
      main,
      .site-footer {
        width: min(100% - 40px, 1180px);
      }

      .site-header {
        padding: 20px 0 62px;
      }

      .header-meta {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 70px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 38px;
      }

      .hero-side {
        max-width: 420px;
      }

      .gallery {
        grid-template-columns: 1fr;
        row-gap: 42px;
      }

      .site-footer {
        flex-direction: column;
        gap: 9px;
      }
    }

    @page {
      size: A4 portrait;
      margin: 10mm;
    }

    @media print {
      html,
      body {
        width: auto;
        min-height: 0;
        background: #ffffff;
      }

      body {
        color: #000000;
      }

      .site-header,
      .site-footer,
      .archive-head {
        display: none;
      }

      main {
        width: auto;
        padding: 0;
        margin: 0;
      }

      .gallery {
        display: block;
      }

      .print-page {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 277mm;
        position: relative;
        break-after: page;
        page-break-after: always;
      }

      .print-page:last-child {
        break-after: auto;
        page-break-after: auto;
      }

      .print-intro {
        display: block;
        flex: 0 0 34mm;
        padding-bottom: 5mm;
      }

      .print-intro-kicker {
        margin-bottom: 3mm;
        color: #777771;
        font-size: 9pt;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .print-intro-title {
        margin-bottom: 2mm;
        color: #000000;
        font-size: 28pt;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 0.9;
        text-transform: uppercase;
      }

      .print-intro-copy {
        color: #777771;
        font-size: 10pt;
        font-weight: 600;
        line-height: 1.2;
      }

      .print-grid {
        display: grid;
        flex: 1 1 auto;
        min-height: 0;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        column-gap: 8mm;
        row-gap: 7mm;
      }

      .print-page:not(.first-page) .print-grid {
        height: 100%;
      }

      .gallery-item {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: hidden;
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .image-wrap {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        background: transparent;
      }

      .image-wrap img {
        width: auto;
        max-width: 100%;
        height: auto;
        max-height: 100%;
        opacity: 1;
      }

      .image-caption {
        flex: 0 0 14mm;
        grid-template-columns: 8mm minmax(0, 1fr);
        gap: 2mm;
        padding-top: 2.5mm;
      }

      .image-number {
        font-size: 9pt;
        font-weight: 600;
      }

      .image-copy {
        font-size: 10pt;
        font-weight: 600;
        line-height: 1.15;
      }

      .image-copy strong {
        margin-bottom: 1mm;
        font-size: 11pt;
        font-weight: 600;
        line-height: 1.05;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .image-wrap img {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-meta">
      <a href="../">The Unknown Beast</a>
      <span>BEAST / TRANSFORM</span>
    </div>

    <div class="hero">
      <div>
        <p class="hero-kicker">Photobox instructions / 01</p>
        <h1>Make a<br>moment.</h1>
      </div>
      <div class="hero-side">
        <p class="hero-side-label">The brief</p>
        <p class="hero-side-copy">Pick a scene. Strike a pose. Take the result with you.</p>
      </div>
    </div>
  </header>

  <main>
    <div class="archive-head">
      <p class="archive-label">Image archive</p>
      <p class="archive-count">27 frames</p>
    </div>

    <section class="gallery" aria-label="Photobox image gallery"></section>
  </main>

  <footer class="site-footer">
    <span>The Unknown Beast</span>
    <span>Photobox Instructions</span>
  </footer>

  <script>
    (function () {
      var names = [
        "Image.jpeg",
        "Image (1).jpeg",
        "Image (2).jpeg",
        "Image (3).jpeg",
        "Image (4).jpeg",
        "Image (5).jpeg",
        "Image (6).jpeg",
        "Image (7).jpeg",
        "Image (8).jpeg",
        "Image (9).jpeg",
        "Image (10).jpeg",
        "Image (11).jpeg",
        "Image (12).jpeg",
        "Image (13).jpeg",
        "Image (14).jpeg",
        "Image (15).jpeg",
        "Image (16).jpeg",
        "Image (17).jpeg",
        "Image (18).jpeg",
        "Image (19).jpeg",
        "Image (20).jpeg",
        "Image (21).jpeg",
        "Image (22).jpeg",
        "Image (23).jpeg",
        "Image (24).jpeg",
        "Image (25).jpeg",
        "Image (26).jpeg"
      ];

      var titles = [
        "Start here",
        "Choose a scene",
        "Find your angle",
        "Make it yours",
        "Strike a pose",
        "Hold the moment",
        "Keep it bold",
        "Try another look",
        "Make a memory",
        "Stay in frame",
        "Push the button",
        "Wait for it",
        "Almost there",
        "Grab your print",
        "Share the result",
        "Scan and share",
        "Save the scene",
        "Share the fun",
        "Take one more",
        "Make it count",
        "Keep the energy",
        "Freeze the moment",
        "Bring the group",
        "Own the frame",
        "Print the memory",
        "Take it with you",
        "Done."
      ];

      var copies = [
        "Choose your starting point.",
        "Find the look that fits.",
        "Move into the frame.",
        "Add your own energy.",
        "Hold the moment.",
        "Stay in the frame.",
        "Try something unexpected.",
        "There is no wrong version.",
        "Make it worth keeping.",
        "Keep your eyes up.",
        "Let the machine work.",
        "Your image is coming.",
        "One last check.",
        "Take the physical one.",
        "Pass it on.",
        "Take it digital.",
        "Keep the good version.",
        "Make room for everyone.",
        "Because one is never enough.",
        "Give it a little more.",
        "Do not overthink it.",
        "Let it happen.",
        "Better together.",
        "This one is yours.",
        "Make it tangible.",
        "Carry the moment on.",
        "That is the one."
      ];

      var gallery = document.querySelector(".gallery");
      var index;
      var offset;

      for (index = 0; index < names.length; index += 4) {
        var page = document.createElement("div");
        var grid = document.createElement("div");

        page.className = "print-page";
        grid.className = "print-grid";

        if (index === 0) {
          var intro = document.createElement("div");
          var introKicker = document.createElement("p");
          var introTitle = document.createElement("h2");
          var introCopy = document.createElement("p");

          page.className += " first-page";
          intro.className = "print-intro";
          introKicker.className = "print-intro-kicker";
          introTitle.className = "print-intro-title";
          introCopy.className = "print-intro-copy";
          introKicker.textContent = "The Unknown Beast / Photobox instructions";
          introTitle.textContent = "Make a moment.";
          introCopy.textContent = "Pick a scene. Strike a pose. Take the result with you.";
          intro.appendChild(introKicker);
          intro.appendChild(introTitle);
          intro.appendChild(introCopy);
          page.appendChild(intro);
        }

        for (offset = 0; offset < 4 && index + offset < names.length; offset += 1) {
          var itemIndex = index + offset;
          var figure = document.createElement("figure");
          var imageWrap = document.createElement("div");
          var image = document.createElement("img");
          var caption = document.createElement("figcaption");
          var number = document.createElement("span");
          var copy = document.createElement("span");
          var title = document.createElement("strong");

          figure.className = "gallery-item";
          imageWrap.className = "image-wrap";
          caption.className = "image-caption";
          number.className = "image-number";
          copy.className = "image-copy";

          image.src = encodeURI(names[itemIndex]);
          image.alt = "Photobox reference image " + String(itemIndex + 1);
          image.loading = "eager";
          number.textContent = String(itemIndex + 1).padStart(2, "0");
          title.textContent = titles[itemIndex];
          copy.appendChild(title);
          copy.appendChild(document.createTextNode(copies[itemIndex]));
          caption.appendChild(number);
          caption.appendChild(copy);
          imageWrap.appendChild(image);
          figure.appendChild(imageWrap);
          figure.appendChild(caption);
          grid.appendChild(figure);
        }

        page.appendChild(grid);
        gallery.appendChild(page);
      }
    }());
  </script>
</body>
</html>
