<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobox Instructions - The Unknown Beast</title>

  <style>
    /* Reset */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --paper: #f5f5f0;
      --ink: #0a0a0a;
      --acid: #e8ff00;
      --muted: #74746f;
      --soft: #e9e9e2;
      --font: Inter, Arial, Helvetica, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
    }

    .site-header {
      padding: 24px 32px 86px;
    }

    .header-inner,
    main,
    .site-footer {
      width: min(1180px, calc(100% - 64px));
      margin: 0 auto;
    }

    .header-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 104px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .header-meta a {
      color: var(--ink);
      text-decoration: none;
    }

    .header-meta a:hover,
    .header-meta a:focus-visible {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--acid);
      border: 1px solid var(--ink);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(240px, 0.7fr);
      align-items: end;
      gap: 72px;
    }

    .hero-kicker {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 850px;
      font-size: clamp(58px, 10vw, 134px);
      font-weight: 900;
      letter-spacing: -0.09em;
      line-height: 0.82;
      text-transform: uppercase;
    }

    .hero-side {
      max-width: 350px;
      padding-bottom: 4px;
    }

    .hero-side-label {
      margin-bottom: 15px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .hero-side-copy {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
    }

    main {
      padding: 0 0 94px;
    }

    .section-intro {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 32px;
      padding: 16px 0 18px;
      margin-bottom: 34px;
      background: var(--ink);
      color: var(--paper);
    }

    .section-label,
    .section-count {
      padding: 0 18px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .section-count {
      color: var(--acid);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 28px;
      row-gap: 62px;
    }

    .gallery-item {
      min-width: 0;
    }

    .image-wrap {
      background: var(--soft);
    }

    .image-wrap img {
      display: block;
      width: 100%;
      height: auto;
      transition: opacity 180ms ease;
    }

    .gallery-item:hover .image-wrap img,
    .gallery-item:focus-within .image-wrap img {
      opacity: 0.78;
    }

    .image-caption {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 14px;
      padding-top: 12px;
    }

    .image-number {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .image-copy {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .image-copy strong {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 900;
      line-height: 1.05;
      text-transform: uppercase;
    }

    .site-footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding: 22px 0 30px;
      background: var(--ink);
      color: var(--paper);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .site-footer span:last-child {
      color: var(--acid);
    }

    :focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 4px;
    }

    @media (max-width: 760px) {
      .site-header {
        padding: 20px 20px 58px;
      }

      .header-inner,
      main,
      .site-footer {
        width: min(100% - 40px, 1180px);
      }

      .header-meta {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 68px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 38px;
      }

      .hero-side {
        max-width: 420px;
      }

      .section-intro {
        margin-bottom: 28px;
      }

      .section-label,
      .section-count {
        padding: 0 14px;
      }

      .gallery {
        grid-template-columns: 1fr;
        row-gap: 42px;
      }

      .site-footer {
        flex-direction: column;
        gap: 9px;
        padding-right: 14px;
        padding-left: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .image-wrap img {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-meta">
        <a href="../">The Unknown Beast</a>
        <span class="header-status"><span class="status-dot"></span>BEAST / TRANSFORM</span>
      </div>

      <div class="hero">
        <div>
          <p class="hero-kicker"><span class="status-dot"></span>Photobox instructions / 01</p>
          <h1>Make a<br>moment.</h1>
        </div>
        <div class="hero-side">
          <p class="hero-side-label">The brief</p>
          <p class="hero-side-copy">Pick a scene. Strike a pose. Take the result with you.</p>
        </div>
      </div>
    </div>
  </header>

    </div>

        <div class="image-wrap"><img src="Image.jpeg" alt="Photobox reference image 01" loading="lazy"></div>

      </figure>
      <figure class="gallery-item">
        <div class="image-wrap"><img src="Image%20(1).jpeg" alt="Photobox reference image 02" loading="lazy"></div>
        <figcaption class="image-caption"><span class="image-number">02</span><span class="image-copy"><strong>Choose a scene</strong>Find the look that fits.</span></figcaption>
      </figure>
      <figure class="gallery-item">
        <div class="image-wrap"><img src="Image%20(2).jpeg" alt="Photobox reference image 03" loading="lazy"></div>
        <figcaption class="image-caption"><span class="image-number">03</span><span class="image-copy"><strong>Find your angle</strong>Move into the frame.</span></figcaption>
      </figure>
      <figure class="gallery-item">
        <div class="image-wrap"><img src="Image%20(3).jpeg" alt="Photobox reference image 04" loading="lazy"></div>

      </figure>
      <figure class="gallery-item">
        <div class="image-wrap"><img src="Image%20(4).jpeg" alt="Photobox reference image 05" loading="lazy"></div>
        <figcaption class="image-caption"><span class="image-number">05</span><span class="image-copy"><strong>Strike a pose</strong>Hold the moment.</span></figcaption>
      </figure>
      <figure class="gallery-item">
        <div class="image-wrap"><img src="Image%20(5).jpeg" alt="Photobox reference image 06" loading="lazy"></div>
        <figcaption class="image-caption"><span class="image-number">06</span><span class="image-copy"><strong>Hold the moment</strong>Stay in the frame.</span></figcaption>
      </figure>
      <figure class="gallery-item">
        <div class="image-wrap"><img src="Image%20(6).jpeg" alt="Photobox reference image 07" loading="lazy"></div>
        <figcaption class="image-caption"><span class="image-number">07</span><span class="image-copy"><strong>Keep it bold</strong>Try something unexpected.</span></figcaption>

      <figure class="gallery-item">

      </figure>
      <figure class="gallery-item">
        <div class="image-wrap"><img src="Image%20(9).jpeg" alt="Photobox reference image 10" loading="lazy"></div>

      <figure class="gallery-item">

        <figcaption class="image-caption"><span class="image-number">12</span><span class="image-copy"><strong>Wait for it</strong>Your image is coming.</span></figcaption>
      </figure>
      <figure class="gallery-item">
        <div class="image-wrap"><img src="Image%20(12).jpeg" alt="Photobox reference image 13" loading="lazy"></div>
        <figcaption class="image-caption"><span class="image-number">13</span><span class="image-copy"><strong>Almost there</strong>One last check.</span></figcaption>
      </figure>
      <figure class="gallery-item">
        <div class="image-wrap"><img src="Image%20(13).jpeg" alt="Photobox reference image 14" loading="lazy"></div>
        <figcaption class="image-caption"><span class="image-number">14</span><span class="image-copy"><strong>Grab your print</strong>Take the physical one.</span></figcaption>

      <figure class="gallery-item">

      <figure class="gallery-item">
        <div class="image-wrap"><img src="Image%20(19).jpeg" alt="Photobox reference image 20" loading="lazy"></div>
        <figcaption class="image-caption"><span class="image-number">20</span><span class="image-copy"><strong>Make it count</strong>Give it a little more.</span></figcaption>
      </figure>
      <figure class="gallery-item">
        <div class="image-wrap"><img src="Image%20(20).jpeg" alt="Photobox reference image 21" loading="lazy"></div>
        <figcaption class="image-caption"><span class="image-number">21</span><span class="image-copy"><strong>Keep the energy</strong>Do not overthink it.</span></figcaption>
      </figure>
      <figure class="gallery-item">
        <div class="image-wrap"><img src="Image%20(21).jpeg" alt="Photobox reference image 22" loading="lazy"></div>
        <figcaption class="image-caption"><span class="image-number">22</span><span class="image-copy"><strong>Freeze the moment</strong>Let it happen.</span></figcaption>

      <figure class="gallery-item">
        <div class="image-wrap"><img src="Image%20(22).jpeg" alt="Photobox reference image 23" loading="lazy"></div>

      <figure class="gallery-item">

        <figcaption class="image-caption"><span class="image-number">24</span><span class="image-copy"><strong>Own the frame</strong>This one is yours.</span></figcaption>
      </figure>
      <figure class="gallery-item">
        <div class="image-wrap"><img src="Image%20(24).jpeg" alt="Photobox reference image 25" loading="lazy"></div>
        <figcaption class="image-caption"><span class="image-number">25</span><span class="image-copy"><strong>Print the memory</strong>Make it tangible.</span></figcaption>
      </figure>
      <figure class="gallery-item">
        <div class="image-wrap"><img src="Image%20(25).jpeg" alt="Photobox reference image 26" loading="lazy"></div>
        <figcaption class="image-caption"><span class="image-number">26</span><span class="image-copy"><strong>Take it with you</strong>Carry the moment on.</span></figcaption>
      </figure>
      <figure class="gallery-item">
        <div class="image-wrap"><img src="Image%20(26).jpeg" alt="Photobox reference image 27" loading="lazy"></div>
        <figcaption class="image-caption"><span class="image-number">27</span><span class="image-copy"><strong>Done.</strong>That is the one.</span></figcaption>
      </figure>
    </section>
  </main>

  <footer class="site-footer">
    <span>The Unknown Beast</span>
    <span>Photobox Instructions</span>
  </footer>
</body>
</html>
