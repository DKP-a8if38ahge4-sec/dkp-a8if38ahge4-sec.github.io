<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beast AI Watermark</title>
  <meta name="description" content="Minimal Beast AI watermark logo in English and German.">
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f1ea;
      --muted: #9b9b9b;
      --surface: #111111;
      --line: #2a2a2a;
      --accent: #d7ff38;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--surface);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 40px 0 64px;
    }

    .intro {
      border-bottom: 1px solid var(--line);
      margin-bottom: 28px;
      padding-bottom: 24px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(42px, 8vw, 88px);
      letter-spacing: -0.07em;
      line-height: 0.88;
      margin: 18px 0 12px;
      max-width: 760px;
    }

    .intro p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
      margin: 0;
      max-width: 520px;
    }

    .variants {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .variant {
      border: 1px solid var(--line);
      min-height: 300px;
      padding: 24px;
    }

    .variant-label {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .mark {
      align-items: flex-start;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 220px;
    }

    .mark strong {
      font-size: clamp(42px, 7vw, 78px);
      letter-spacing: -0.08em;
      line-height: 0.82;
    }

    .mark span {
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-top: 12px;
      text-transform: uppercase;
    }

    @media (max-width: 720px) {
      main {
        width: min(100% - 28px, 560px);
        padding-top: 28px;
      }

      .variants {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <div class="eyebrow">Beast AI / Watermark</div>
      <h1>Heavy signal.<br>Zero noise.</h1>
      <p>Minimal watermark directions for Beast AI, shown in English and German.</p>
    </header>

    <section class="variants" aria-label="Logo variants">
      <article class="variant">
        <div class="variant-label">English</div>
        <div class="mark" aria-label="Beast AI Generated">
          <strong>*Beast AI</strong>
          <span>Generated</span>
        </div>
      </article>

      <article class="variant">
        <div class="variant-label">Deutsch</div>
        <div class="mark" aria-label="Beast AI Generiert">
          <strong>*Beast AI</strong>
          <span>Generiert</span>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
