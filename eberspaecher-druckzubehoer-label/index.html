<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eberspaecher Label</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      display: grid;
      place-items: center;
      padding: 18mm;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .sheet {
      width: 210mm;
      height: 297mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14mm;
      background: #ffffff;
      transform: rotate(90deg);
      transform-origin: center center;
    }

    .logo {
      display: block;
      width: 105mm;
      height: auto;
      filter: grayscale(1) contrast(1.4);
    }

    .description {
      margin: 0;
      font-size: 28px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    @page {
      size: A4 landscape;
      margin: 0;
    }

    @media print {
      html,
      body {
        width: 297mm;
        height: 210mm;
        padding: 0;
      }
    }

    @media screen and (max-width: 760px) {
      body {
        padding: 12px;
      }

      .sheet {
        width: min(100%, 210mm);
        height: min(141.4vw, 297mm);
      }
    }
  </style>
</head>
<body>
  <main class="sheet" aria-label="Eberspaecher Druckerzubehoer Label">
    <img class="logo" src="https://www.eberspaecher.com/fileadmin/ebe_templates/gfx/eberspaecher-logo.svg" alt="Eberspaecher">
    <p class="description">Druckerzubeh&ouml;r</p>
  </main>
</body>
</html>
