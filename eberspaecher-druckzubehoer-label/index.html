<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eberspaecher Label</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      display: grid;
      place-items: center;
      padding: 18mm;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .sheet {
      position: relative;
      width: 210mm;
      height: 297mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15mm;
      background: #ffffff;
      border: 1px solid #111111;
      outline: 1px solid #111111;
      outline-offset: 5mm;
      transform: rotate(90deg);
      transform-origin: center center;
    }

    .sheet::before,
    .sheet::after {
      content: '';
      position: absolute;
      width: 18mm;
      height: 18mm;
    }

    .sheet::before {
      top: 9mm;
      left: 9mm;
      border-top: 2px solid #111111;
      border-left: 2px solid #111111;
    }

    .sheet::after {
      right: 9mm;
      bottom: 9mm;
      border-right: 2px solid #111111;
      border-bottom: 2px solid #111111;
    }

    .logo {
      display: block;
      width: 112mm;
      height: auto;
      filter: grayscale(1) contrast(1.45);
    }

    .description {
      display: flex;
      align-items: center;
      gap: 8mm;
      margin: 0;
      font-size: 29px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .description::before,
    .description::after {
      content: '';
      display: block;
      width: 25mm;
      border-top: 2px solid #111111;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html,
      body {
        width: 210mm;
        height: 297mm;
        padding: 0;
      }
    }

    @media screen and (max-width: 760px) {
      body {
        padding: 12px;
      }

      .sheet {
        width: min(100%, 210mm);
        height: min(141.4vw, 297mm);
      }

      .logo {
        width: 72%;
      }

      .description {
        font-size: clamp(15px, 4vw, 24px);
        gap: 4vw;
      }

      .description::before,
      .description::after {
        width: 12vw;
      }
    }
  </style>
</head>
<body>
  <main class="sheet" aria-label="Eberspaecher Druckerzubehoer Label">
    <img class="logo" src="https://www.eberspaecher.com/fileadmin/ebe_templates/gfx/eberspaecher-logo.svg" alt="Eberspaecher">
    <p class="description">Druckerzubeh&ouml;r</p>
  </main>
</body>
</html>
