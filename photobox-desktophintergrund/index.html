<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171614">
  <title>Photobox - Bitte warten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Base reset */
    :root {
      --ink: #171614;
      --panel: #252321;
      --paper: #eee9df;
      --muted: #a9a095;
      --signal: #ff5638;
      --line: rgba(238, 233, 223, 0.18);
      --bay-width: 15vw;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
    }

    body {
      color: var(--paper);
      font-family: 'Space Mono', monospace;
    }

    /* Wallpaper stage */
    .wallpaper {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 520px;
      padding: 3vw;
      overflow: hidden;
      background:
        radial-gradient(circle at 82% 14%, rgba(255, 86, 56, 0.12), transparent 26%),
        linear-gradient(135deg, #1b1917 0%, var(--ink) 68%);
    }

    .wallpaper::before {
      position: absolute;
      top: 3vw;
      right: 3vw;
      width: 20vw;
      height: 1px;
      background: var(--line);
      content: '';
    }

    .wallpaper::after {
      position: absolute;
      right: -10vw;
      bottom: -22vw;
      width: 52vw;
      height: 52vw;
      border: 1px solid rgba(255, 86, 56, 0.18);
      border-radius: 50%;
      content: '';
    }

    /* Quiet space reserved for desktop icons */
    .icon-bay {
      position: absolute;
      top: 3vw;
      left: 3vw;
      bottom: 3vw;
      width: var(--bay-width);
      min-width: 126px;
      border: 1px solid rgba(238, 233, 223, 0.26);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: inset 0 0 0 8px rgba(23, 22, 20, 0.28);
    }

    .icon-bay::before,
    .icon-bay::after {
      position: absolute;
      left: 18px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--signal);
      content: '';
    }

    .icon-bay::before {
      top: 19px;
    }

    .icon-bay::after {
      bottom: 19px;
      background: rgba(238, 233, 223, 0.28);
    }

    .bay-label {
      position: absolute;
      right: 17px;
      bottom: 17px;
      color: rgba(238, 233, 223, 0.34);
      font-size: 9px;
      letter-spacing: 0.16em;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    /* Main message */
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: calc(100% - var(--bay-width) - 5vw);
      height: 100%;
      margin-left: calc(var(--bay-width) + 2vw);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: clamp(9px, 0.72vw, 12px);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .topline strong {
      color: var(--signal);
      font-weight: 700;
    }

    .message {
      max-width: 980px;
      margin: auto 0;
      padding: 5vh 0 7vh;
    }

    .message-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 26px;
      color: var(--signal);
      font-size: clamp(10px, 0.8vw, 13px);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .message-mark::before {
      width: 38px;
      height: 3px;
      background: var(--signal);
      content: '';
    }

    h1 {
      max-width: 1040px;
      margin: 0;
      color: var(--paper);
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(42px, 7.2vw, 132px);
      font-weight: 400;
      letter-spacing: -0.075em;
      line-height: 0.89;
      text-wrap: balance;
    }

    h1 em {
      color: var(--signal);
      font-style: normal;
    }

    .footer-note {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 2rem;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: clamp(9px, 0.75vw, 12px);
      line-height: 1.45;
      letter-spacing: 0.04em;
      text-transform: lowercase;
    }

    .footer-note p {
      max-width: 560px;
      margin: 0;
    }

    .footer-code {
      flex-shrink: 0;
      color: rgba(238, 233, 223, 0.46);
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      :root {
        --bay-width: 18vw;
      }

      .wallpaper {
        min-height: 420px;
        padding: 5vw;
      }

      .icon-bay {
        top: 5vw;
        left: 5vw;
        bottom: 5vw;
        border-radius: 18px;
      }

      .content {
        width: calc(100% - var(--bay-width) - 7vw);
        margin-left: calc(var(--bay-width) + 2vw);
      }

      .topline {
        gap: 12px;
        font-size: 8px;
      }

      .topline span:last-child {
        display: none;
      }

      .message {
        padding: 4vh 0;
      }

      h1 {
        font-size: clamp(34px, 10vw, 72px);
      }

      .footer-note {
        display: block;
        font-size: 9px;
      }

      .footer-code {
        display: block;
        margin-top: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="wallpaper" aria-labelledby="waiting-message">
    <aside class="icon-bay" aria-label="Freier Bereich f&uuml;r Desktop-Symbole">
      <span class="bay-label">desktop area</span>
    </aside>

    <section class="content">
      <div class="topline" aria-label="Status">
        <span>Photobox / <strong>Bereit</strong></span>
        <span>Bitte einen Moment</span>
      </div>

      <div class="message">
        <p class="message-mark">Systemhinweis</p>
        <h1 id="waiting-message">Bitte hab einen Moment Geduld, die Photobox wird sich in <em>K&uuml;rze</em> &ouml;ffnen.</h1>
      </div>

      <footer class="footer-note">
        <p>Bitte stelle sicher, dass die Stele mit dem Internet verbunden ist.</p>
        <span class="footer-code">PB-001 / waiting room</span>
      </footer>
    </section>
  </main>
</body>
</html>
