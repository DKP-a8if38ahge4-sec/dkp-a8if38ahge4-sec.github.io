<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0A">
  <title>Photobox - Bitte warten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0A0A0A;
      --white: #F5F5F0;
      --accent: #E8FF00;
      --border: #222222;
      --card: #111111;
      --muted: rgba(245, 245, 240, 0.42);
      --bay-width: 22vw;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--black);
    }

    body {
      color: var(--white);
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wallpaper {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 520px;
      padding: 3vw;
      overflow: hidden;
      background: var(--black);
    }

    .wallpaper::after {
      position: absolute;
      right: -10vw;
      bottom: -22vw;
      width: 52vw;
      height: 52vw;
      border: 1px solid rgba(232, 255, 0, 0.12);
      border-radius: 50%;
      content: '';
    }

    .icon-bay {
      position: absolute;
      top: 3vw;
      left: 3vw;
      bottom: 3vw;
      width: var(--bay-width);
      min-width: 170px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--card);
      box-shadow: inset 0 0 0 8px rgba(10, 10, 10, 0.35);
    }

    .bay-label {
      position: absolute;
      right: 17px;
      bottom: 17px;
      color: rgba(245, 245, 240, 0.28);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .content {
      position: relative;
      z-index: 1;
      width: calc(100% - var(--bay-width) - 5vw);
      height: 100%;
      margin-left: calc(var(--bay-width) + 2vw);
    }

    .message {
      max-width: 980px;
      margin: clamp(8vh, 11vh, 15vh) 0 0;
      padding: 0;
    }

    .message-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 26px;
      color: var(--accent);
      font-size: clamp(10px, 0.8vw, 13px);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .message-mark::before {
      width: 38px;
      height: 3px;
      background: var(--accent);
      content: '';
    }

    h1 {
      max-width: 1040px;
      margin: 0;
      color: var(--white);
      font-size: clamp(42px, 7.2vw, 132px);
      font-weight: 900;
      letter-spacing: -0.075em;
      line-height: 1.02;
      text-transform: uppercase;
    }

    h1 em { color: var(--accent); font-style: normal; }

    .footer-note {
      position: absolute;
      top: 58%;
      left: 0;
      width: min(100%, 720px);
      padding: 18px 22px;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      background: var(--card);
      color: var(--white);
      transform: translateY(-50%);
    }

    .footer-note strong {
      display: block;
      margin-bottom: 7px;
      color: var(--accent);
      font-size: clamp(10px, 0.72vw, 12px);
      font-weight: 900;
      letter-spacing: 0.14em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .footer-note p {
      max-width: 650px;
      margin: 0;
      color: var(--white);
      font-size: clamp(12px, 0.95vw, 16px);
      font-weight: 500;
      line-height: 1.5;
    }

    @media (max-width: 720px) {
      :root { --bay-width: 24vw; }

      .wallpaper { min-height: 420px; padding: 5vw; }
      .icon-bay { top: 5vw; left: 5vw; bottom: 5vw; min-width: 96px; }
      .content {
        width: calc(100% - var(--bay-width) - 7vw);
        margin-left: calc(var(--bay-width) + 2vw);
      }
      .message { margin-top: 8vh; }
      .message-mark { margin-bottom: 18px; }
      h1 { font-size: clamp(34px, 10vw, 72px); }
      .footer-note {
        top: 61%;
        width: 100%;
        padding: 14px 15px;
      }
      .footer-note p { font-size: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="wallpaper" aria-labelledby="waiting-message">
    <aside class="icon-bay" aria-label="Freier Bereich f&uuml;r Desktop-Symbole">
      <span class="bay-label">desktop area</span>
    </aside>

    <section class="content">
      <div class="message">
        <p class="message-mark">Systemhinweis</p>
        <h1 id="waiting-message">Bitte hab einen Moment Geduld, die Photobox wird sich in <em>K&uuml;rze</em> &ouml;ffnen.</h1>
      </div>

      <aside class="footer-note" aria-label="Internetverbindung">
        <strong>Internetverbindung erforderlich</strong>
        <p>Bitte stelle sicher, dass die Stele mit dem Internet verbunden ist.</p>
      </aside>
    </section>
  </main>
</body>
</html>
