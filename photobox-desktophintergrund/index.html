<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0A">
  <title>Photobox - Bitte warten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0A0A0A;
      --white: #F5F5F0;
      --accent: #E8FF00;
      --border: #222222;
      --card: #111111;
      --muted: rgba(245, 245, 240, 0.42);
      --bay-width: 15vw;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--black);
    }

    body {
      color: var(--white);
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wallpaper {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 520px;
      padding: 3vw;
      overflow: hidden;
      background: var(--black);
    }

    .wallpaper::before {
      position: absolute;
      top: 3vw;
      right: 3vw;
      width: 20vw;
      height: 1px;
      background: var(--border);
      content: '';
    }

    .wallpaper::after {
      position: absolute;
      right: -10vw;
      bottom: -22vw;
      width: 52vw;
      height: 52vw;
      border: 1px solid rgba(232, 255, 0, 0.12);
      border-radius: 50%;
      content: '';
    }

    .icon-bay {
      position: absolute;
      top: 3vw;
      left: 3vw;
      bottom: 3vw;
      width: var(--bay-width);
      min-width: 126px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--card);
      box-shadow: inset 0 0 0 8px rgba(10, 10, 10, 0.35);
    }

    .icon-bay::before,
    .icon-bay::after {
      position: absolute;
      left: 18px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      content: '';
    }

    .icon-bay::before { top: 19px; }
    .icon-bay::after {
      bottom: 19px;
      background: rgba(245, 245, 240, 0.28);
    }

    .bay-label {
      position: absolute;
      right: 17px;
      bottom: 17px;
      color: rgba(245, 245, 240, 0.28);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: calc(100% - var(--bay-width) - 5vw);
      height: 100%;
      margin-left: calc(var(--bay-width) + 2vw);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: clamp(9px, 0.72vw, 12px);
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .topline strong { color: var(--accent); }

    .message {
      max-width: 980px;
      margin: auto 0;
      padding: 5vh 0 7vh;
    }

    .message-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 26px;
      color: var(--accent);
      font-size: clamp(10px, 0.8vw, 13px);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .message-mark::before {
      width: 38px;
      height: 3px;
      background: var(--accent);
      content: '';
    }

    h1 {
      max-width: 1040px;
      margin: 0;
      color: var(--white);
      font-size: clamp(42px, 7.2vw, 132px);
      font-weight: 900;
      letter-spacing: -0.075em;
      line-height: 0.89;
      text-transform: uppercase;
    }

    h1 em { color: var(--accent); font-style: normal; }

    .footer-note {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 20px 0 0;
      border-top: 2px solid var(--accent);
      color: var(--white);
      font-size: clamp(12px, 0.95vw, 16px);
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0.01em;
    }

    .internet-signal {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      background: var(--accent);
      color: var(--black);
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
    }

    .footer-note p { max-width: 680px; margin: 0; }
    .footer-note strong {
      display: block;
      margin-bottom: 2px;
      color: var(--accent);
      font-size: 0.78em;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .footer-code {
      color: rgba(245, 245, 240, 0.3);
      font-size: clamp(9px, 0.65vw, 11px);
      font-weight: 500;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      :root { --bay-width: 18vw; }

      .wallpaper { min-height: 420px; padding: 5vw; }
      .icon-bay { top: 5vw; left: 5vw; bottom: 5vw; }
      .content {
        width: calc(100% - var(--bay-width) - 7vw);
        margin-left: calc(var(--bay-width) + 2vw);
      }
      .topline { gap: 12px; font-size: 8px; }
      .topline span:last-child { display: none; }
      .message { padding: 4vh 0; }
      h1 { font-size: clamp(34px, 10vw, 72px); }
      .footer-note {
        grid-template-columns: auto 1fr;
        gap: 10px;
        font-size: 9px;
      }
      .internet-signal { width: 26px; height: 26px; font-size: 17px; }
      .footer-code { grid-column: 2; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="wallpaper" aria-labelledby="waiting-message">
    <aside class="icon-bay" aria-label="Freier Bereich f&uuml;r Desktop-Symbole">
      <span class="bay-label">desktop area</span>
    </aside>

    <section class="content">
      <div class="topline" aria-label="Status">
        <span>Photobox / <strong>Bereit</strong></span>
        <span>Bitte einen Moment</span>
      </div>

      <div class="message">
        <p class="message-mark">Systemhinweis</p>
        <h1 id="waiting-message">Bitte hab einen Moment Geduld, die Photobox wird sich in <em>K&uuml;rze</em> &ouml;ffnen.</h1>
      </div>

      <footer class="footer-note">
        <span class="internet-signal" aria-hidden="true">!</span>
        <p><strong>Internetverbindung erforderlich</strong>Bitte stelle sicher, dass die Stele mit dem Internet verbunden ist.</p>
        <span class="footer-code">PB-001 / waiting room</span>
      </footer>
    </section>
  </main>
</body>
</html>
