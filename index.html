<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Projekte - Die Kavallerie</title>
  <style>
    /* Temporary client-side gate only - this is not real authentication. */
    :root {
      --color-bg: #f2f4f7;
      --color-text: #1d1d1d;
      --color-accent: #ff003c;
      --color-white: #ffffff;
      --color-border: #1d1d1d;
      --font-base: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-headline: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-base);
    }

    header {
      padding: 3rem 2rem 2.5rem;
      background: var(--color-accent);
      color: var(--color-white);
    }

    .header-inner,
    main,
    footer {
      width: 100%;
      max-width: 1100px;
      margin-right: auto;
      margin-left: auto;
    }

    header h1 {
      color: var(--color-white);
      font-family: var(--font-headline);
      font-size: clamp(3.2rem, 9vw, 5rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.95;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      padding: 3rem 2rem;
    }

    .gate {
      max-width: 560px;
      margin: 8vh auto 4rem;
    }

    .section-label {
      margin-bottom: 1.5rem;
      color: var(--color-text);
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1.3;
      text-transform: uppercase;
      opacity: 0.48;
    }

    .gate h2 {
      max-width: 12ch;
      margin-bottom: 1rem;
      font-family: var(--font-headline);
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.95;
      text-transform: uppercase;
    }

    .gate-copy {
      max-width: 42rem;
      margin-bottom: 2rem;
      font-size: 1rem;
      line-height: 1.55;
    }

    .password-form {
      display: flex;
      align-items: stretch;
      gap: 0.75rem;
    }

    .password-form label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .password-form input {
      min-width: 0;
      flex: 1;
      padding: 0.95rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: 0;
      background: var(--color-white);
      color: var(--color-text);
      font: inherit;
    }

    .password-form input:focus,
    .password-form button:focus-visible,
    .project-row:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 3px;
    }

    .password-form button {
      padding: 0.95rem 1.25rem;
      border: 1px solid var(--color-accent);
      border-radius: 0;
      background: var(--color-accent);
      color: var(--color-white);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .password-form button:hover {
      background: var(--color-text);
      border-color: var(--color-text);
    }

    .form-message {
      min-height: 1.5rem;
      margin-top: 0.75rem;
      color: var(--color-accent);
      font-size: 0.9rem;
    }

    .project-list {
      display: flex;
      flex-direction: column;
      margin: 0 -1rem;
      border-top: 1px solid var(--color-border);
    }

    .project-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem 1rem;
      border-bottom: 1px solid var(--color-border);
      color: var(--color-text);
      text-decoration: none;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .project-row:hover {
      background: var(--color-accent);
      color: var(--color-white);
    }

    .project-row:hover .project-url,
    .project-row:hover .project-arrow {
      color: var(--color-white);
    }

    .project-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .project-name {
      font-family: var(--font-headline);
      font-size: clamp(1.35rem, 4vw, 2.5rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      text-transform: uppercase;
    }

    .project-url {
      color: var(--color-text);
      font-size: 0.875rem;
      opacity: 0.5;
      transition: color 0.15s ease;
    }

    .project-arrow {
      flex-shrink: 0;
      color: var(--color-accent);
      font-size: 1.75rem;
      line-height: 1;
      transition: color 0.15s ease;
    }

    footer {
      padding: 2rem;
      border-top: 1px solid var(--color-border);
      color: var(--color-text);
      font-size: 0.875rem;
      line-height: 1.5;
      opacity: 0.55;
    }

    footer p + p {
      margin-top: 0.5rem;
    }

    @media (max-width: 640px) {
      header,
      main,
      footer {
        padding-right: 1.25rem;
        padding-left: 1.25rem;
      }

      .password-form {
        flex-direction: column;
      }

      .password-form button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- This page is intentionally not securely password protected. It contains no sensitive data and only deters casual crawling. -->
  <header id="site-header" hidden>
    <div class="header-inner">
      <h1>Projekte</h1>
    </div>
  </header>

  <main>
    <section class="gate" id="password-gate" aria-labelledby="gate-title">
      <p class="section-label">Interner Bereich</p>
      <h2 id="gate-title">Passwort erforderlich</h2>
      <p class="gate-copy">Gib das Passwort ein, um die Projekt&uuml;bersicht zu &ouml;ffnen.</p>
      <form class="password-form" id="password-form">
        <label for="password">Passwort</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">&Ouml;ffnen</button>
      </form>
      <p class="form-message" id="form-message" role="alert" aria-live="polite"></p>
    </section>

    <section id="project-content" hidden aria-labelledby="project-title">
      <p class="section-label" id="project-title" tabindex="-1">Alle Projekte</p>
      <nav class="project-list" id="project-list" aria-label="Projekt&uuml;bersicht"></nav>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      var ACCESS_PASSWORD = 'D13kava77er1!';
      var projects = [
        { name: 'Beispielseite', path: './beispielseite/' },
        { name: 'Katzen', path: './katzen/' },
        { name: 'Beast Angebot Klett Sprachen', path: './beast-angebot-klett-sprachen/' },
        { name: 'BEAST Businessplan Jahr 1', path: './beast-businessplan/' },
        { name: 'Stadtwerke Tuebingen', path: './stadtwerke-tuebingen/' },
        { name: 'Beast Angebot Betonservice', path: './beast-angebot-betonservice/' },
        { name: 'Photobox Desktop Hintergrund', path: './photobox-desktophintergrund/' },
        { name: 'Photobox Instructions', path: './photobox-instructions/' },
        { name: 'Eberspaecher Druckerzubehoer Label', path: './eberspaecher-druckzubehoer-label/' }
      ];

      var form = document.getElementById('password-form');
      var passwordInput = document.getElementById('password');
      var message = document.getElementById('form-message');
      var gate = document.getElementById('password-gate');
      var content = document.getElementById('project-content');
      var projectList = document.getElementById('project-list');
      var siteHeader = document.getElementById('site-header');

      function renderProjects() {
        projects.forEach(function (project) {
          var link = document.createElement('a');
          var info = document.createElement('span');
          var name = document.createElement('span');
          var url = document.createElement('span');
          var arrow = document.createElement('span');

          link.className = 'project-row';
          link.href = project.path;
          info.className = 'project-info';
          name.className = 'project-name';
          url.className = 'project-url';
          arrow.className = 'project-arrow';
          name.textContent = project.name;
          url.textContent = project.path;
          arrow.textContent = '\u2192';
          arrow.setAttribute('aria-hidden', 'true');

          info.appendChild(name);
          info.appendChild(url);
          link.appendChild(info);
          link.appendChild(arrow);
          projectList.appendChild(link);
        });
      }

      function renderFooter() {
        var footer = document.createElement('footer');
        var notice = document.createElement('p');
        var copyright = document.createElement('p');

        footer.id = 'site-footer';
        notice.textContent = 'Hinweis: Diese Seite verwendet eine clientseitige Passwortabfrage. Das Passwort wird im Browser gepr\u00fcft, daher bietet dieser Schutz keine echte Zugriffskontrolle. Auf dieser Seite werden keine sensiblen Daten gespeichert.';
        copyright.innerHTML = '&copy; Die Kavallerie';
        footer.appendChild(notice);
        footer.appendChild(copyright);
        document.body.appendChild(footer);
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        if (passwordInput.value === ACCESS_PASSWORD) {
          renderProjects();
          renderFooter();
          siteHeader.hidden = false;
          gate.hidden = true;
          content.hidden = false;
          passwordInput.value = '';
          message.textContent = '';
          document.getElementById('project-title').focus();
          return;
        }

        passwordInput.value = '';
        message.textContent = 'Das Passwort ist nicht korrekt.';
        passwordInput.focus();
      });
    }());
  </script>
</body>
</html>
